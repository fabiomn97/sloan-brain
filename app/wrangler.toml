# Sloan Brain on Cloudflare Workers (free plan). See ../SETUP.md.
name = "sloan-brain"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Private site: only reachable on the custom domain, behind Cloudflare Access.
workers_dev = false
preview_urls = false
routes = [{ pattern = "brain.fabio.cool", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true    # every asset request goes through the Access check too

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sloan-brain"
database_id = "639adb6b-470b-4078-9e15-b4cd9f70a6ba"

[vars]
OWNER_NAME = "Fabio"
# From Zero Trust > Access > Applications > brain.fabio.cool (SETUP.md, step 5).
ACCESS_TEAM_DOMAIN = "fabiomn97.cloudflareaccess.com"
ACCESS_AUD = "7c631b7104df3e326df89bbe234a9eb0e6f66d2e1eadecef9379a76335482261"
# Models (Workers AI). Change here if Cloudflare retires one.
ANSWER_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
EXPAND_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
