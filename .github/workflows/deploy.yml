# On every push to main: test the pipeline, sync corpus/ into the search
# database, and deploy the app to brain.fabio.cool.
# Needs two repository secrets (SETUP.md, step 6): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: Deploy Sloan Brain

on:
  push:
    branches: [main]
    paths: ["corpus/**", "demo/**", "app/**", "brain/**", "tests/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Drop and reload the whole search database"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Pipeline test (fake Canvas, offline)
        run: python tests/test_pipeline.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Login gate test
        run: node tests/test_access.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set yet; skipping deploy (see SETUP.md, step 6)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
        working-directory: app
      - name: Sync corpus into D1
        if: steps.secrets.outputs.ready == 'true'
        run: python brain/sync.py --remote ${{ inputs.rebuild && '--rebuild' || '' }}
      - name: Deploy the Worker
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
        working-directory: app

      # Public demo at demo.fabio.cool (MIT OpenCourseWare content in demo/).
      - name: Sync demo corpus into its D1
        if: steps.secrets.outputs.ready == 'true'
        run: SLOAN_BRAIN_ROOT=demo python brain/sync.py --remote --env demo
      - name: Deploy the demo Worker
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy --env demo
        working-directory: app
      - name: Pre-answer the demo's suggested questions
        if: steps.secrets.outputs.ready == 'true'
        # Keep in sync with DEMO_SUGGESTIONS in app/public/app.js. Answers are cached,
        # so this costs AI time once; later runs are free. Never fails the deploy.
        run: |
          sleep 20
          while IFS= read -r q; do
            [ -z "$q" ] && continue
            body=$(python -c 'import json,sys; print(json.dumps({"q": sys.argv[1]}))' "$q")
            for attempt in 1 2 3; do
              if curl -sfN --max-time 120 -X POST https://demo.fabio.cool/api/ask \
                   -H 'content-type: application/json' -d "$body" | grep -q 'event: done'; then
                echo "ok: $q"; break
              fi
              sleep 30
            done
          done <<'EOF'
          How do two-part tariffs help a firm capture more value?
          What is the winner's curse, and how do I avoid it when bidding?
          How should I read a company's statement of cash flows?
          Why do cartels break down, and when can collusion last?
          EOF
